<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galaksi Savaşçısı Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #030308; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #02020a; }
        #ui { position: absolute; top: 15px; left: 15px; width: calc(100% - 30px); display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 5; }
        #scoreBoard { color: #00f0ff; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px rgba(0, 240, 255, 0.7); }
        #highScoreLabel { color: #aaaaaa; font-size: 12px; display: block; }
        #livesBoard { display: flex; gap: 5px; }
        .heartIcon { color: #ff0055; font-size: 22px; text-shadow: 0 0 8px #ff0055; }
        .heartIcon.lost { color: #333333; text-shadow: none; opacity: 0.3; }
        
        #bossHealthContainer { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); width: 70%; background: rgba(255,255,255,0.1); border: 2px solid #ff0055; border-radius: 10px; padding: 3px; display: none; pointer-events: none; z-index: 5; }
        #bossHealthBar { height: 12px; background: linear-gradient(90deg, #ff0055, #ff7700); width: 100%; border-radius: 6px; transition: width 0.1s; }
        #bossTitle { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #ff0055; font-weight: bold; letter-spacing: 1px; }

        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 15, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; display: none; z-index: 10; text-align: center; }
        #gameOverScreen h1 { color: #ff0055; font-size: 36px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0055; }
        #gameOverScreen p { font-size: 16px; color: #e0e0e0; margin-bottom: 5px; }
        #restartBtn { margin-top: 20px; padding: 12px 30px; font-size: 16px; font-weight: bold; background: linear-gradient(45deg, #ff0055, #ff7700); color: #fff; border: none; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scoreBoard">
            <span id="highScoreLabel">En Yüksek: <span id="highScoreDisplay">0</span></span>
            SKOR: <span id="score">0</span>
        </div>
        <div id="livesBoard">
            <span class="heartIcon">♥</span>
            <span class="heartIcon">♥</span>
            <span class="heartIcon">♥</span>
        </div>
    </div>

    <div id="bossHealthContainer">
        <div id="bossTitle">BOSS AŞAMASI</div>
        <div id="bossHealthBar"></div>
    </div>

    <div id="gameOverScreen">
        <h1>GÖREV BAŞARISIZ</h1>
        <p>Skorun: <span id="finalScore">0</span></p>
        <p>En Yüksek Skor: <span id="highScore">0</span></p>
        <button id="restartBtn" onclick="restartGame()">TEKRAR DENE</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const uiElements = {
            score: document.getElementById("score"),
            highScoreDisplay: document.getElementById("highScoreDisplay"),
            finalScore: document.getElementById("finalScore"),
            highScore: document.getElementById("highScore"),
            gameOverScreen: document.getElementById("gameOverScreen"),
            lives: document.querySelectorAll("#livesBoard .heartIcon"),
            bossHealthContainer: document.getElementById("bossHealthContainer"),
            bossHealthBar: document.getElementById("bossHealthBar")
        };

        let storedHighScore = localStorage.getItem("highScore") || 0;
        uiElements.highScoreDisplay.innerText = storedHighScore;

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                osc.start(now);

                if (type === 'shoot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.stop(now + 0.08);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.stop(now + 0.15);
                }
            } catch (e) {}
        }

        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let lastShootTime = 0;
        let invulnerableUntil = 0;
        
        // Boss Değişkenleri
        let boss = null;
        let nextBossScore = 500;

        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 100,
            width: 40,
            height: 50
        };

        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        function updateUI() {
            uiElements.score.innerText = score;
            uiElements.lives.forEach((heart, index) => {
                if (index < lives) heart.classList.remove("lost");
                else heart.classList.add("lost");
            });
        }

        function spawnBoss() {
            boss = {
                x: canvas.width / 2 - 50,
                y: -100,
                targetY: 70,
                width: 100,
                height: 70,
                hp: 100,
                maxHp: 100,
                speedX: 2.5,
                lastShoot: Date.now()
            };
            uiElements.bossHealthContainer.style.display = "block";
            uiElements.bossHealthBar.style.width = "100%";
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function hitPlayer() {
            lives--;
            updateUI();
            createExplosion(player.x + player.width/2, player.y + player.height/2, "#00f0ff");
            playSound('hit');

            if (lives <= 0) {
                isGameOver = true;
                uiElements.finalScore.innerText = score;
                if (score > storedHighScore) {
                    storedHighScore = score;
                    localStorage.setItem("highScore", score);
                    uiElements.highScoreDisplay.innerText = score;
                    uiElements.highScore.innerText = score + " (REKOR!)";
                } else {
                    uiElements.highScore.innerText = storedHighScore;
                }
                uiElements.gameOverScreen.style.display = "flex";
                uiElements.bossHealthContainer.style.display = "none";
            } else {
                invulnerableUntil = Date.now() + 2000;
            }
        }

        function update() {
            if (isGameOver) return;
            const now = Date.now();

            // Boss Doğurma Tetikleyici (Her 500 Puan)
            if (score >= nextBossScore && !boss) {
                spawnBoss();
            }

            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = -5;
            });

            // Otomatik Ateş
            if (now - lastShootTime > 180) {
                bullets.push({ x: player.x + 5, y: player.y + 10, vy: -12 });
                bullets.push({ x: player.x + player.width - 9, y: player.y + 10, vy: -12 });
                playSound('shoot');
                lastShootTime = now;
            }

            // Oyuncu Mermileri
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y += b.vy;
                if (b.y < -20) bullets.splice(i, 1);
            }

            // Düşman Mermileri (Boss Ateşi)
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += eb.speed;

                if (
                    invulnerableUntil < now &&
                    eb.x > player.x && eb.x < player.x + player.width &&
                    eb.y > player.y && eb.y < player.y + player.height
                ) {
                    enemyBullets.splice(i, 1);
                    hitPlayer();
                    continue;
                }

                if (eb.y > canvas.height) enemyBullets.splice(i, 1);
            }

            // Boss Mantığı
            if (boss) {
                if (boss.y < boss.targetY) {
                    boss.y += 2;
                } else {
                    boss.x += boss.speedX;
                    if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) {
                        boss.speedX *= -1;
                    }
                }

                // Boss Ateş Etsin
                if (now - boss.lastShoot > 700) {
                    enemyBullets.push({ x: boss.x + 20, y: boss.y + boss.height, speed: 5 });
                    enemyBullets.push({ x: boss.x + boss.width - 20, y: boss.y + boss.height, speed: 5 });
                    boss.lastShoot = now;
                }

                // Boss Çarpışma Testi (Mermi vs Boss)
                for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                    let b = bullets[bIndex];
                    if (b.x > boss.x && b.x < boss.x + boss.width && b.y > boss.y && b.y < boss.y + boss.height) {
                        boss.hp -= 2;
                        bullets.splice(bIndex, 1);
                        createExplosion(b.x, b.y, "#ff7700", 3);
                        uiElements.bossHealthBar.style.width = (boss.hp / boss.maxHp * 100) + "%";

                        if (boss.hp <= 0) {
                            createExplosion(boss.x + boss.width/2, boss.y + boss.height/2, "#ff0055", 30);
                            boss = null;
                            uiElements.bossHealthContainer.style.display = "none";
                            score += 150;
                            nextBossScore += 500;
                            updateUI();
                            break;
                        }
                    }
                }
            }

            // Normal Düşmanlar
            for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                let e = enemies[eIndex];
                e.y += e.speed;

                if (e.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                    continue;
                }

                if (
                    invulnerableUntil < now &&
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y
                ) {
                    enemies.splice(eIndex, 1);
                    hitPlayer();
                    continue;
                }

                for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                    let b = bullets[bIndex];
                    if (b.x < e.x + e.width && b.x + 4 > e.x && b.y < e.y + e.height && b.y + 12 > e.y) {
                        createExplosion(e.x + e.width/2, e.y + e.height/2, "#ff0055");
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        updateUI();
                        break;
                    }
                }
            }

            // Parçacıklar
            for (let pIndex = particles.length - 1; pIndex >= 0; pIndex--) {
                let p = particles[pIndex];
                p.x += p.vx; p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(pIndex, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Yıldızlar
            ctx.fillStyle = "#ffffff";
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

            if (!isGameOver) {
                // Oyuncu Gemi
                if (invulnerableUntil < Date.now() || Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.fillStyle = "#00f0ff";
                    ctx.beginPath();
                    ctx.moveTo(player.x + player.width/2, player.y);
                    ctx.lineTo(player.x, player.y + player.height);
                    ctx.lineTo(player.x + player.width, player.y + player.height);
                    ctx.closePath();
                    ctx.fill();
                }

                // Mermiler
                ctx.fillStyle = "#00ffff";
                bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 12));

                ctx.fillStyle = "#ff0055";
                enemyBullets.forEach(eb => ctx.fillRect(eb.x - 2, eb.y, 5, 10));

                // Normal Düşmanlar
                ctx.fillStyle = "#ff0055";
                enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));

                // Boss
                if (boss) {
                    ctx.fillStyle = "#aa0033";
                    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(boss.x + 10, boss.y + 15, boss.width - 20, 20);
                }

                // Parçacık Efektleri
                particles.forEach(p => {
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
        }

        // Dokunmatik Kontrol
        window.addEventListener("touchmove", (e) => {
            if (!isGameOver) {
                player.x = e.touches[0].clientX - player.width / 2;
                if (player.x < 0) player.x = 0;
                if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            }
        });

        // Düşman Üretimi
        function spawnEnemyLoop() {
            if (!isGameOver) {
                if (!boss || Math.random() < 0.3) {
                    const size = 35;
                    enemies.push({ x: Math.random() * (canvas.width - size), y: -size, width: size, height: size, speed: Math.random() * 2 + 2 });
                }
            }
            setTimeout(spawnEnemyLoop, 800);
        }
        spawnEnemyLoop();

        // Döngü
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        function restartGame() {
            score = 0;
            lives = 3;
            isGameOver = false;
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            boss = null;
            nextBossScore = 500;
            player.x = canvas.width / 2 - 20;
            uiElements.gameOverScreen.style.display = "none";
            uiElements.bossHealthContainer.style.display = "none";
            updateUI();
        }
    </script>
</body>
</html>
